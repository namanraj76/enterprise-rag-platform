databases:
  - name: aurelia-db
    databaseName: aurelia
    user: aurelia
    plan: free
    ipAllowList: []

services:
  - type: web
    name: aurelia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python run.py
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aurelia-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_API_KEY
        value: ""
      - key: OLLAMA_MODEL
        value: llama3.2:1b
